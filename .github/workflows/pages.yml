name: Deploy exam to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase config is filled in
        run: |
          if grep -q 'SUPABASE_URL: ""' public/config.js; then
            echo "::error::public/config.js has no SUPABASE_URL — the deployed exam would not work. See README step 2."
            exit 1
          fi

      # Pages lets browsers cache files for 10 min. Stamping every local file
      # reference with the commit id makes a browser load a matching set of
      # files after each deploy (never a new page with an old module).
      - name: Version file references (cache busting)
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#((src|href)=\"(assets/[^\"?]+|config\.js))\"#\1?v=$V\"#g" public/*.html
          sed -i -E "s#(from \"\./[a-z]+\.js)\"#\1?v=$V\"#g" public/assets/js/*.js
          grep -h -o -E '(src|href)="[^"]*\?v=[^"]*"|from "[^"]*\?v=[^"]*"' public/*.html public/assets/js/*.js

      - uses: actions/configure-pages@v5

      # Only the public/ folder is published — never the bank or SQL files.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
